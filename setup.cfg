# HueCIT Chatbot RAG - Setup Configuration

[metadata]
name = huecit-chatbot-rag
version = attr: src.__version__
description = Chatbot hỗ trợ kỹ thuật vận hành phần mềm với RAG và phân tích ảnh lỗi
author = HueCIT Team
author_email = team@huecit.vn
license = Proprietary
url = https://github.com/TienDat11/huecit-chatbot-rag

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pandas>=2.0.0
    numpy>=1.24.0
    tiktoken>=0.5.0

[options.packages.find]
where = src

[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    data,
    output,
    notebooks

[tool:pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths = tests
pythonpath = src